# Danu server configuration, read by the systemd units as an EnvironmentFile
# and by the scripts as ordinary environment variables. Every value here is a
# default the command line can still override.

# Where the source data lives. The package creates /var/lib/danu, but the
# existing tree on util is /opt/opengeofiction/elevation and moving 380 MB of
# irreplaceable squares is a separate decision from installing a package.
#BASE=/var/lib/danu

# Rebuildable working directories, and where the build publishes.
#WORKBASE=/var/cache/danu
#PUBROOT=/var/lib/danu/publish

# Read the drawn rivers and lakes as elevation constraints.
#
# Off by default, so that installing Danu does not change what the pipeline
# produces. The feature is real and measured - on gobras it removed 29% of the
# river length which climbs against the ground, and flattened Lake Kinser's
# 41,734 cells from 51 distinct elevations to one - but it was developed after
# the pipeline this replaces, and turning it on changes every DEM it touches.
# That is a deliberate act, and it wants its own rebuild and its own look.
WATER_CONSTRAINTS=0
