# Danu server configuration, read by the systemd units as an EnvironmentFile
# and by the scripts as ordinary environment variables. Every value here is a
# default the command line can still override.

# Where the source data lives. The package creates /var/lib/danu, but the
# existing tree on util is /opt/opengeofiction/elevation and moving 380 MB of
# irreplaceable squares is a separate decision from installing a package.
#BASE=/var/lib/danu

# Rebuildable working directories, and where the build publishes.
#WORKBASE=/var/cache/danu
#PUBROOT=/var/lib/danu/publish

