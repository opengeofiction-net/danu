# The parameters the elevation build and the editor share.
#
# The editor reads this file (danu.surface.params), with no defaults of its
# own. The shell build does not read it yet: danu-build-zone carries the same
# values as ${VAR:-default} constants, and tests/test_params.py holds those
# constants equal to this file, key by key, until the shell reads it too.
# tests/golden/params.lock holds the reference surface to these values, so a
# change here is a deliberate rebuild of the reference, not a quiet drift.

[grid]
arcsec = 1                  # master DEM resolution
hgt_arcsec = 3              # the .hgt archive stays at 1201 samples

[fill]
metres = 1850               # how far a cell may look for a contour pair
barrier_cells = 2           # how thick a contour is, for the sight test
grad_min = 0.02             # refuse to extrapolate below this gradient
pass2 = "diffuse"           # Laplace diffusion; "linear" was removed. A record, not a
                            # switch: isofill implements this one and the shell passes
                            # nothing; the editor refuses any other value

[memory]
max_mem_mb = 18500          # isofill sizes its own arrays against this

[smooth]
cells = 5                   # box filter for the hillshade copy only

[publish]
dem_compress = "LERC_ZSTD"
dem_max_z_error = 0.05      # metres; chosen after comparing 0.01 in QGIS
dem_zstd_level = 9
