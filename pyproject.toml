[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danu"
version = "0.0.0"
description = "Contour editor and elevation pipeline for OpenGeofiction"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "licences/GPL-3"]
authors = [{ name = "Lee Kindness and OpenGeofiction administrators" }]

# GDAL is deliberately absent. It is not installable from PyPI in any way worth
# relying on: the server takes the distribution's python3-gdal, and the desktop
# packages bundle it. Pinning it here would break both.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-qt>=4", "hypothesis>=6"]

[project.scripts]
danu-build = "danu.cli.build:main"
danu-check = "danu.cli.check:main"
danu-square = "danu.cli.square:main"
danu-render = "danu.cli.render:main"

[project.gui-scripts]
danu = "danu.ui.main:main"

[tool.setuptools.packages.find]
include = ["danu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
