[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danu"
version = "0.0.0"
description = "Contour editor and elevation pipeline for OpenGeofiction"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "licences/GPL-3"]
authors = [{ name = "Lee Kindness and OpenGeofiction administrators" }]

# GDAL is deliberately absent. It is not installable from PyPI in any way worth
# relying on: the server takes the distribution's python3-gdal, and the desktop
# packages bundle it. Pinning it here would break both.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-qt>=4", "hypothesis>=6", "ruff>=0.16"]

# No [project.scripts] yet. Declaring entry points for modules which do not
# exist ships commands that fail on import: the first package built this way
# installed /usr/bin/danu-check pointing at danu.cli.check:main with nothing
# behind it, and put the editor's launcher in the server package. It also
# collided with debian/danu-server.install over /usr/bin/danu-build, where two
# files claim one path and which wins is luck.
#
# The server's entry points are the shell scripts, installed by the package.
# These come back when danu.cli exists, and danu-build has to be one thing or
# the other by then.

[tool.ruff]
target-version = "py311"

# The width isort wraps a long `from x import a, b, c` at, and nothing else:
# E501 is not selected, so no other line in the tree is measured against it.
# Ruff's default of 88 would explode six of the Qt imports into one name per
# line. The codebase writes past 88 freely - 911 lines do - and 110 leaves 132.
line-length = 110

[tool.ruff.lint]
# F and E402, and deliberately not the rest of pycodestyle yet.
#
# F is what this was added for: forty-five unused imports had accumulated
# across nineteen files with nothing watching, including five in the commit
# that noticed. It has no opinion about style - an unused import, an unused
# variable, a name that is not defined.
#
# E402 was selected on the grounds that ninety-odd `# noqa: E402` comments were
# already written against it. That reason was wrong: ruff does not count a bare
# `pytest.importorskip('PySide6')` as code, so the imports after it are at the
# top of the file as far as the rule is concerned and eighty-nine of the ninety
# one comments suppress nothing. The two that are live are the ones after an
# assignment - `osr = pytest.importorskip(...)` in tests/test_land_clamp.py and
# tests/test_mercator_proj.py - which is code, and E402 is kept for those.
#
# RUF100 is what settles the inert ones, and it is why the rest of this list
# exists. It reports a `# noqa` that suppresses nothing, so every directive in
# the tree now has to be true: ninety E402 comments went because they were
# not, and the twelve that remained named rules nothing was running.
#
# BLE001 and E731 are those twelve rules, turned on rather than deleted. Both
# were selected with no new work to do - every site they flag already carried
# the directive, so the tree was clean the moment they went in. What they buy
# is that the directives now mean something. A bare `except Exception` in a
# worker thread is deliberate six times over, because a UI that dies on an
# unexpected error is worse than one that reports it as text, and each of
# those six says so. The seventh, in danu/checks/rivers.py, re-raises on the
# last attempt of a retry loop, and BLE001 does not flag a handler that
# re-raises - only one that swallows. It was never blind, its directive never
# suppressed anything, and RUF100 removed it. The five `E731`
# lambdas are ctypes pointer casts and Mercator scalings, local and one line
# each. The point of both rules is the *next* one, which will have to be
# argued for in a comment rather than appearing unremarked.
#
# B is the first rule here that found defects rather than untidiness. Twenty
# nine of its thirty three were B905, a `zip` with no `strict=`, which stops
# at the shorter argument and says nothing. Fourteen of those were the
# pairwise idiom `zip(x, x[1:])`, where the lengths differ by one on purpose
# and the answer is itertools.pairwise, not a strictness argument. The other
# fifteen pair two sequences that have to be the same length - node ids
# against coordinates, a geotransform against a geotransform - and now say so.
# Four of the fifteen are inside `all(...)` or `assert` in a test, where a
# length mismatch made the assertion pass over the shorter run.
#
# The rest of E stays out - it would be a style change nobody has asked for:
# 140 semicolons that pair two short assignments on purpose, and twenty-five
# `l, t, r, b = scene_rect` unpackings where `l` means left. Both are choices
# this codebase has made, and a linter is not the place to reopen them.
#
# I sorts the imports. It was left out of the first cut because it rewrites
# every file's header and that is better seen on its own; this is that change.
# The grouping it enforces - standard library, third party, then the package -
# is the one the files mostly already used, by hand and not everywhere.
select = ["F", "E402", "I", "RUF100", "BLE001", "E731", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 flags a call in a default argument because the result is built once and
# shared by every caller. SquareName is a frozen dataclass, so the shared value
# cannot be mutated and `def square_with(elevations, name=SquareName(10, 10))`
# is fine; telling ruff it is immutable is more honest than suppressing the
# rule at the one site.
extend-immutable-calls = ["danu.core.square.SquareName"]

[tool.ruff.lint.per-file-ignores]
# The GDAL idiom for closing a dataset is to drop the last reference to it:
# `out_ds = sea_ds = water_ds = None` is three closes, not three dead stores,
# and removing the "unused" name would leave the file open.
"danu/surface/land_clamp.py" = ["F841"]
"danu/surface/sea_mask.py" = ["F841"]

[tool.setuptools.packages.find]
include = ["danu*"]

# the shipped layer defaults ride inside the package
[tool.setuptools.package-data]
"danu.ui" = ["*.toml"]
# the tiles' colour ramp, read by the editor and installed to /etc/danu for the build
"danu.surface" = ["*.ramp", "*.ini"]
"danu.params" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
