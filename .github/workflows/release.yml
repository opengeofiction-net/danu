name: Release

# A release is a tag: v0.2.0 builds every artefact, runs each, and attaches
# them to a draft GitHub Release, which a person reads and publishes. The tag
# must name the version the source says - danu/__init__.py, which pyproject
# reads and debian/changelog repeats - or nothing is built.
#
# A pull request that touches what the release is made from runs the same
# builds and runs, and stops short of the release, so a broken release is
# found before the tag rather than after it. The desktop builds join this as
# J2 to J4 make them.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - debian/**
      - pyproject.toml
      - danu/__init__.py
      - extern/isofill
      - packaging/windows/**
      - packaging/linux/**
      - packaging/macos/**
      - packaging/stack.txt
      - packaging/smoke.py
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -eu
          v=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('danu/__init__.py').read()).group(1))")
          deb=$(head -1 debian/changelog | sed -E 's/^danu \(([^)-]+)-[0-9]+\).*/\1/')
          echo "source $v, debian/changelog $deb"
          [ "$v" = "$deb" ] || { echo "debian/changelog says $deb, danu/__init__.py $v"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} is not v$v"; exit 1; }
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # The Python package, built and installed into a clean virtualenv, and asked
  # its version from outside the source tree - where an import of the
  # checkout would answer instead of the wheel.
  wheel:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      - name: run
        working-directory: /
        run: |
          set -eu
          python -m venv /tmp/w && /tmp/w/bin/pip install -q "$GITHUB_WORKSPACE"/dist/*.whl
          got=$(/tmp/w/bin/python -c "import danu; print(danu.__version__)")
          [ "$got" = "${{ needs.version.outputs.version }}" ] || { echo "the wheel says $got"; exit 1; }
          # the package data the editor reads at run time: its layers, its icons, its help
          /tmp/w/bin/python - <<'PY'
          from importlib import resources
          ui = resources.files('danu.ui')
          for f in ('default-layers.toml', 'icons/danu-256.png', 'help/getting-started.md', 'help/layers.md'):
              assert (ui / f).is_file(), f'the wheel has no danu/ui/{f}'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*

  # The Debian packages, built on Debian 13 - what util runs, and the oldest
  # Debian the editor's package is for - with the isofill they depend on built
  # beside them from the pinned submodule: python3-danu, the code; danu-server,
  # the pipeline; danu-editor, the editor on the distribution's PySide6.
  #
  # Installed as util is upgraded: the latest published danu-server first,
  # then these over it with apt, which resolves the rest - so a release that
  # moves files between packages is upgraded through, not only installed
  # fresh. Then run: the code imports from its installed path, finds the
  # library and accepts its version, the build script starts, and danu starts
  # the editor, offscreen, until its usage log says the window is up.
  deb:
    needs: version
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          apt-get install -y --no-install-recommends build-essential debhelper dh-python \
            pybuild-plugin-pyproject python3-all python3-setuptools libgdal-dev desktop-file-utils
      - name: build
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p out
          (cd extern/isofill && dpkg-buildpackage -us -uc -b)
          dpkg-buildpackage -us -uc -b
          # each beside its own source tree, as dpkg-buildpackage leaves them
          mv ../python3-danu_*.deb ../danu-server_*.deb ../danu-editor_*.deb extern/isofill_*.deb out/
          ls -l out
          desktop-file-validate packaging/linux/danu.desktop
      - name: the published danu-server, to upgrade from
        run: |
          set -eu
          mkdir -p prev
          python3 - "$GITHUB_REPOSITORY" <<'PY'
          import json, sys, urllib.request
          # the newest published release that has the packages, pre-releases
          # included: releases/latest skips those, and v0.2.0 is one. One
          # without them, as v1.1.0 (macOS only) is, is passed over.
          # python3-danu too: since 0.2.0-2 danu-server depends on it, at its
          # own version
          rels = json.load(urllib.request.urlopen(f'https://api.github.com/repos/{sys.argv[1]}/releases'))
          rel = next(r for r in rels if not r['draft']
                     and any(a['name'].startswith('danu-server_') for a in r['assets']))
          for a in rel['assets']:
              if a['name'].startswith(('danu-server_', 'python3-danu_', 'isofill_')) and a['name'].endswith('.deb'):
                  print(rel['tag_name'], a['name'])
                  urllib.request.urlretrieve(a['browser_download_url'], 'prev/' + a['name'])
          PY
          apt-get install -y ./prev/*.deb
      - name: run
        run: |
          set -eu
          # --reinstall: built at the published version - a PR before the next
          # bump - apt takes these for what is installed and keeps the release's
          apt-get install -y --reinstall ./out/isofill_*.deb ./out/python3-danu_*.deb ./out/danu-server_*.deb \
            ./out/danu-editor_*.deb
          dpkg -l 'danu*' 'python3-danu' isofill | grep ^ii
          cd /
          python3 - <<'PY'
          import danu
          from danu.surface import isofill_lib
          assert danu.__file__.startswith('/usr/lib/python3/dist-packages/'), danu.__file__
          assert danu.__version__ == '${{ needs.version.outputs.version }}', danu.__version__
          # load() refuses any isofill but the one isofill_lib speaks to
          print('danu', danu.__version__, 'isofill', isofill_lib.Isofill.load().version)
          PY
          danu-build-zone 2>&1 | grep -q 'usage: danu-build-zone <zone>'
          # the data drop as its unit runs it: the packaged gunicorn on the
          # packaged app, answering from a zone on disk
          mkdir -p /tmp/drop/osm-squares/gobras
          echo 'gobras  N20E086-N21E087' > /tmp/drop/zones
          BASE=/tmp/drop PUBROOT=/tmp/drop/publish gunicorn --config python:danu.drop.gunicorn \
            --bind 127.0.0.1:8337 --daemon --pid /tmp/drop/pid \
            'danu.drop.app:create()'
          python3 - <<'PY'
          import json, time, urllib.request
          for _ in range(30):
              try:
                  z = json.load(urllib.request.urlopen('http://127.0.0.1:8337/zones'))
                  break
              except OSError:
                  time.sleep(1)
          assert z == {'zones': [{'name': 'gobras', 'squares': ['N20E086-N21E087'], 'inactive': None}]}, z
          print('data drop', json.load(urllib.request.urlopen('http://127.0.0.1:8337/')))
          PY
          kill "$(cat /tmp/drop/pid)"
          mkdir -p /tmp/h
          HOME=/tmp/h QT_QPA_PLATFORM=offscreen danu > /tmp/editor.txt 2>&1 &
          t=0
          until ls /tmp/h/.local/share/danu/usage/*.jsonl >/dev/null 2>&1 || [ $t -ge 60 ]; do sleep 2; t=$((t + 2)); done
          log=$(ls /tmp/h/.local/share/danu/usage/*.jsonl 2>/dev/null | head -1)
          [ -n "$log" ] || { cat /tmp/editor.txt; echo 'no usage log after 60 s'; exit 1; }
          head -1 "$log"
          kill $! || true
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: out/*.deb

  # J2: the tree Danu installs on Windows, from the MSYS2 UCRT64 stack the CI
  # windows-stack job tests, packed by Inno Setup. See packaging/windows/.
  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgfortran
            mingw-w64-ucrt-x86_64-gdal
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gdal
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-pyside6
            mingw-w64-ucrt-x86_64-ntldd
      # pinned 2026-10-20: MSYS2's hdf5 2.2.0-4 (19 Oct) came after its GDAL
      # 3.13.3-3 (15 Oct) was built against 2.2.0-2, and osgeo's _gdal then
      # fails to load - "The specified procedure could not be found". The hdf5
      # GDAL was built against, until MSYS2 builds GDAL again; take this step
      # out then, and see the stack check below pass without it.
      # msys2-gdal-watch.yml tells #235 when a newer GDAL is there
      - name: pins
        run: pacman -U --noconfirm https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-hdf5-2.2.0-2-any.pkg.tar.zst
      - name: the tree
        run: bash packaging/windows/build-tree.sh "$(cygpath -u "$RUNNER_TEMP")/tree"
      - name: the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp `
            "/DVersion=${{ needs.version.outputs.version }}" "/DTree=$env:RUNNER_TEMP\tree\Danu" `
            "/DOut=$env:GITHUB_WORKSPACE\out" packaging\windows\danu.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.exe
      # J2c: the same tree as an MSIX, for the Store, which signs it. Not on
      # the release: unsigned, it installs nowhere
      - name: the MSIX
        shell: pwsh
        run: |
          packaging\windows\build-msix.ps1 -Tree "$env:RUNNER_TEMP\tree\Danu" `
            -Version ${{ needs.version.outputs.version }} -Out msix
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: msix/*.msix

  # The installer on a runner as a mapper's machine is: nothing of MSYS2 set
  # up, and PATH cut to Windows' own, so the tree can find nothing of the
  # runner's. Installed for the user, silently; the golden square built with
  # the installed Python, GDAL and isofill and held to the reference; and
  # Danu.exe started, offscreen, until its usage log says the window is up.
  windows-run:
    needs: [version, windows]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: setup
      - name: install
        run: |
          $setup = (Get-ChildItem setup\*.exe).FullName
          $p = Start-Process -Wait -PassThru $setup -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$env:RUNNER_TEMP\Danu"
          if ($p.ExitCode) { exit $p.ExitCode }
          "{0:N0} MB installed" -f ((Get-ChildItem -Recurse "$env:RUNNER_TEMP\Danu" | Measure-Object Length -Sum).Sum / 1MB)
      - name: the golden square, built by the installed Danu
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:GDAL_DATA = "$env:RUNNER_TEMP\Danu\share\gdal"
          $env:PROJ_DATA = "$env:RUNNER_TEMP\Danu\share\proj"
          & "$env:RUNNER_TEMP\Danu\bin\python.exe" packaging\smoke.py `
            tests\golden\S24E125_Los_Pizarrales.osm.xz tests\golden\expected.tif "$env:RUNNER_TEMP\smoke"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Danu.exe starts the editor
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $usage = "$env:LOCALAPPDATA\danu\usage"
          Start-Process "$env:RUNNER_TEMP\Danu\Danu.exe"
          $t = 0
          while (-not (Test-Path "$usage\*.jsonl") -and $t -lt 60) { Start-Sleep 2; $t += 2 }
          $log = Get-ChildItem "$usage\*.jsonl" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $log) {
            # pythonw says nothing; the same start with python.exe says why
            $d = "$env:RUNNER_TEMP\Danu"
            $env:PATH = "$d\bin;$env:PATH"
            $env:GDAL_DATA = "$d\share\gdal"; $env:PROJ_DATA = "$d\share\proj"
            $p = Start-Process -PassThru "$d\bin\python.exe" -ArgumentList '-X','faulthandler','-m','danu.ui' `
              -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt" -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
            if (-not $p.WaitForExit(30000)) { $p | Stop-Process -Force }
            "exit $($p.ExitCode)"; Get-Content "$env:RUNNER_TEMP\out.txt", "$env:RUNNER_TEMP\err.txt"
            throw 'no usage log after 60 s'
          }
          $start = Get-Content $log.FullName -TotalCount 1 | ConvertFrom-Json
          "started: $($start.kind) danu $($start.danu) qt $($start.qt)"
          if ($start.danu -ne '${{ needs.version.outputs.version }}') { throw "the window says danu $($start.danu)" }
          Get-Process pythonw -ErrorAction SilentlyContinue | Stop-Process -Force

  # The MSIX installed as the Store would install it, on a fresh runner: signed
  # here with a throwaway certificate whose subject is the manifest's
  # publisher, trusted, and added with Add-AppxPackage. Then the checks
  # windows-run makes of the installer: the golden square built by the
  # installed copy, and the editor started - through the package's danu
  # alias, so in the package's context, where what it writes to AppData lands
  # in the package's own folder.
  windows-msix-run:
    needs: [version, windows]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: msix
          path: msix
      - name: sign with a test certificate and install
        run: |
          $msix = (Get-ChildItem msix\*.msix).FullName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix)
          $r = New-Object System.IO.StreamReader($zip.GetEntry('AppxManifest.xml').Open())
          [xml] $m = $r.ReadToEnd(); $r.Close(); $zip.Dispose()
          $pub = $m.Package.Identity.Publisher
          "identity $($m.Package.Identity.Name) $($m.Package.Identity.Version), publisher $pub"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $pub -KeyUsage DigitalSignature `
            -FriendlyName 'Danu CI' -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\ci.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\ci.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $msix
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-AppxPackage $msix
          $pkg = Get-AppxPackage -Name $m.Package.Identity.Name
          "installed $($pkg.PackageFullName) at $($pkg.InstallLocation)"
          "PFN=$($pkg.PackageFamilyName)" >> $env:GITHUB_ENV
          "DANU_DIR=$($pkg.InstallLocation)" >> $env:GITHUB_ENV
      # A package's files cannot be run by path from WindowsApps, even here:
      # "ResourceUnavailable". Inside the package's context they can, which
      # Invoke-CommandInDesktopPackage gives; it waits for nothing and shows
      # nothing, so a batch file writes the output and the exit status
      - name: the golden square, built by the installed package
        run: |
          $t = $env:RUNNER_TEMP; $w = $env:GITHUB_WORKSPACE
          @(
            "set PATH=%SystemRoot%\System32;%SystemRoot%"
            "set GDAL_DATA=$env:DANU_DIR\share\gdal"
            "set PROJ_DATA=$env:DANU_DIR\share\proj"
            "`"$env:DANU_DIR\bin\python.exe`" `"$w\packaging\smoke.py`" `"$w\tests\golden\S24E125_Los_Pizarrales.osm.xz`" `"$w\tests\golden\expected.tif`" `"$t\smoke`" > `"$t\smoke.txt`" 2>&1"
            "echo %ERRORLEVEL% > `"$t\smoke.done`""
          ) | Set-Content -Encoding ascii "$t\smoke.cmd"
          Invoke-CommandInDesktopPackage -PackageFamilyName $env:PFN -AppId Danu -Command cmd.exe -Args "/c `"$t\smoke.cmd`""
          $n = 0
          while (-not (Test-Path "$t\smoke.done") -and $n -lt 300) { Start-Sleep 2; $n += 2 }
          Get-Content "$t\smoke.txt" -ErrorAction SilentlyContinue
          if (-not (Test-Path "$t\smoke.done")) { throw 'the smoke test did not finish in 300 s' }
          $rc = [int] (Get-Content "$t\smoke.done").Trim()
          if ($rc) { throw "the smoke test exited $rc" }
      - name: the danu alias starts the editor in the package
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          Start-Process "$env:LOCALAPPDATA\Microsoft\WindowsApps\danu.exe"
          $roots = "$env:LOCALAPPDATA\Packages\$env:PFN", "$env:LOCALAPPDATA\danu"
          $t = 0; $log = $null
          while (-not $log -and $t -lt 60) {
            Start-Sleep 2; $t += 2
            $log = Get-ChildItem -Recurse -Filter *.jsonl $roots -ErrorAction SilentlyContinue |
              Where-Object { $_.Directory.Name -eq 'usage' } | Select-Object -First 1
          }
          if (-not $log) { Get-Process | Where-Object Name -like 'python*'; throw 'no usage log after 60 s' }
          "usage log at $($log.FullName)"
          $start = Get-Content $log.FullName -TotalCount 1 | ConvertFrom-Json
          "started: $($start.kind) danu $($start.danu) qt $($start.qt)"
          if ($start.danu -ne '${{ needs.version.outputs.version }}') { throw "the window says danu $($start.danu)" }
          Get-Process pythonw -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: uninstalls
        run: |
          Get-AppxPackage -Name (Get-AppxPackage | Where-Object PackageFamilyName -eq $env:PFN).Name | Remove-AppxPackage
          if (Get-AppxPackage | Where-Object PackageFamilyName -eq $env:PFN) { throw 'still installed' }

  # J3: the AppImage, from conda-forge's stack at Windows' versions, cut and
  # packed by packaging/linux/build-appdir.sh. conda-forge builds against
  # glibc 2.17 and isofill is built here by its compiler, so the image asks no
  # newer glibc than that of the machine it runs on.
  appimage:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: micromamba
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/micromamba" \
            https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-linux-64
          chmod +x "$RUNNER_TEMP/micromamba"
      - name: the image
        run: |
          MICROMAMBA="$RUNNER_TEMP/micromamba" bash packaging/linux/build-appdir.sh \
            "$RUNNER_TEMP/appimage" ${{ needs.version.outputs.version }}
          mkdir out && mv "$RUNNER_TEMP"/appimage/*.AppImage out/
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: out/*.AppImage

  # The image as a mapper runs it: downloaded, made executable, and started -
  # mounted with FUSE, on a desktop under Xvfb, with the machine's fonts and
  # CA certificates. The golden square built by the image's Python, GDAL and
  # isofill and held to the reference, and the editor started on X11 until its
  # usage log says the window is up. Then the same golden square on CentOS 7,
  # the oldest glibc the image claims, in a container with nothing installed,
  # unpacked rather than mounted since a container has no FUSE.
  appimage-run:
    needs: [version, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: img
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fuse3 xvfb xauth
      - name: the golden square, built by the image
        run: |
          set -eu
          chmod +x img/*.AppImage
          env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin img/*.AppImage --python packaging/smoke.py \
            tests/golden/S24E125_Los_Pizarrales.osm.xz tests/golden/expected.tif "$RUNNER_TEMP/smoke"
      - name: the image starts the editor
        run: |
          set -eu
          h="$RUNNER_TEMP/home2"
          mkdir -p "$h"
          env -i HOME="$h" PATH=/usr/bin:/bin QT_QPA_PLATFORM=xcb \
            xvfb-run -a -s '-screen 0 1280x900x24' img/*.AppImage > "$RUNNER_TEMP/out.txt" 2>&1 &
          t=0
          until ls "$h"/.local/share/danu/usage/*.jsonl >/dev/null 2>&1 || [ $t -ge 60 ]; do sleep 2; t=$((t + 2)); done
          log=$(ls "$h"/.local/share/danu/usage/*.jsonl 2>/dev/null | head -1)
          [ -n "$log" ] || { cat "$RUNNER_TEMP/out.txt"; echo 'no usage log after 60 s'; exit 1; }
          head -1 "$log"
          got=$(head -1 "$log" | python3 -c 'import json, sys; print(json.load(sys.stdin)["danu"])')
          [ "$got" = "${{ needs.version.outputs.version }}" ] || { echo "the window says danu $got"; exit 1; }
          kill $! || true
      - name: the golden square on CentOS 7
        run: |
          docker run --rm -e APPIMAGE_EXTRACT_AND_RUN=1 -v "$PWD:/w:ro" centos:7 sh -c \
            '/w/img/*.AppImage --python /w/packaging/smoke.py /w/tests/golden/S24E125_Los_Pizarrales.osm.xz /w/tests/golden/expected.tif /root/smoke'

  # K2 (#194): Danu.app for Apple Silicon, in a .dmg - from the stack the CI
  # macos-stack job tests. See packaging/macos/.
  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: micromamba
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/micromamba" \
            https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-osx-arm64
          chmod +x "$RUNNER_TEMP/micromamba"
      - name: the app
        run: |
          MICROMAMBA="$RUNNER_TEMP/micromamba" bash packaging/macos/build-app.sh \
            "$RUNNER_TEMP/app" ${{ needs.version.outputs.version }}
          mkdir out && mv "$RUNNER_TEMP"/app/*.dmg out/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*.dmg

  # The app as a mapper runs it, on a runner that has not built it: the .dmg
  # mounted read-only, and the app run from it with nothing of the build's
  # environment. macOS taking it for Danu, not for its Python - which is
  # what names the menu bar and the Dock; the golden square built by the
  # app's Python, GDAL and isofill and held to the reference, and a fault in
  # it found at the next start; and the editor started until its usage log
  # says the window is up.
  macos-run:
    needs: [version, macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dmg
      - name: mounted, signed, and taken for Danu
        run: |
          set -eu
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/vol" dmg/*.dmg
          codesign --verify --deep --verbose=1 "$RUNNER_TEMP/vol/Danu.app"
          who=$(env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin \
            "$RUNNER_TEMP/vol/Danu.app/Contents/MacOS/Danu" --python packaging/macos/whoami.py)
          echo "macOS takes it for: $who"
          [ "$who" = net.opengeofiction.danu ] || { echo 'not taken for Danu'; exit 1; }
      - name: the golden square, built by the app
        run: |
          env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin \
            "$RUNNER_TEMP/vol/Danu.app/Contents/MacOS/Danu" --python packaging/smoke.py \
            tests/golden/S24E125_Los_Pizarrales.osm.xz tests/golden/expected.tif "$RUNNER_TEMP/smoke"
      - name: the app starts the editor
        run: |
          set -eu
          # in the account's own home, whatever HOME says: Qt on macOS asks
          # the system, NSHomeDirectory, for where Application Support is
          u="$(cd ~ && pwd)/Library/Application Support/danu/usage"
          since="$RUNNER_TEMP/since"
          touch "$since"
          env -i HOME="$RUNNER_TEMP/home2" PATH=/usr/bin:/bin QT_QPA_PLATFORM=offscreen \
            "$RUNNER_TEMP/vol/Danu.app/Contents/MacOS/Danu" > "$RUNNER_TEMP/out.txt" 2>&1 &
          t=0
          until [ -n "$(find "$u" -name '*.jsonl' -newer "$since" 2>/dev/null)" ] || [ $t -ge 90 ]; do sleep 2; t=$((t + 2)); done
          log=$(find "$u" -name '*.jsonl' -newer "$since" 2>/dev/null | head -1)
          [ -n "$log" ] || { cat "$RUNNER_TEMP/out.txt"; echo 'no usage log after 90 s'; exit 1; }
          head -1 "$log"
          got=$(head -1 "$log" | python3 -c 'import json, sys; print(json.load(sys.stdin)["danu"])')
          [ "$got" = "${{ needs.version.outputs.version }}" ] || { echo "the window says danu $got"; exit 1; }
          kill $! || true
      # when it does not start: what it said, its own crash files, macOS's
      # report of the process, and the same started with the fault handler
      # on from the first line, through the launcher and through the app's
      # python3 alone
      - name: why the editor did not start
        if: failure()
        run: |
          A="$RUNNER_TEMP/vol/Danu.app"
          echo '--- what it said'; cat "$RUNNER_TEMP/out.txt" || true
          echo '--- its crash files'; cat ~/"Library/Application Support/danu/crashes"/* 2>/dev/null || true
          echo '--- macOS'; for f in ~/Library/Logs/DiagnosticReports/*Danu* ~/Library/Logs/DiagnosticReports/*python*; do
            [ -f "$f" ] && { echo "== $f"; head -c 20000 "$f"; }; done
          # macOS has no timeout(1); perl's alarm is the same
          echo '--- through the launcher, fault handler on'
          env -i HOME="$RUNNER_TEMP/home3" PATH=/usr/bin:/bin QT_QPA_PLATFORM=offscreen \
            perl -e 'alarm 60; exec @ARGV' "$A/Contents/MacOS/Danu" --python packaging/macos/start.py 2>&1 | tail -40 || true
          echo '--- through its python3, fault handler on'
          env -i HOME="$RUNNER_TEMP/home4" PATH=/usr/bin:/bin QT_QPA_PLATFORM=offscreen \
            GDAL_DATA="$A/Contents/Resources/share/gdal" PROJ_DATA="$A/Contents/Resources/share/proj" \
            perl -e 'alarm 60; exec @ARGV' "$A/Contents/Resources/bin/python3" -X faulthandler packaging/macos/start.py 2>&1 | tail -40 || true

  release:
    if: github.ref_type == 'tag'
    needs: [version, wheel, deb, windows, windows-run, windows-msix-run, appimage, appimage-run, macos, macos-run]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ls -l art
          # not the MSIX: it goes to the Store, and unsigned installs nowhere
          rm -f art/*.msix
          gh release create "${GITHUB_REF_NAME}" art/* --repo "${GITHUB_REPOSITORY}" \
            --draft --title "Danu ${{ needs.version.outputs.version }}" --generate-notes
