name: CI

on:
  push:
    branches: [main]
    # a release's tag: only the UI on pip's PySide6 on Windows - see the ui
    # job. The rest ran on the same commit when it reached main; each of
    # those jobs is skipped on a tag
    tags: ['v*']
  pull_request:
  # and by hand, Actions > CI > Run workflow, the same
  workflow_dispatch:

# a newer push to a pull request stops the run of the one before it; main's
# runs all finish, each the record of a merge
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The pure logic, on both targets. GDAL is deliberately not installed here:
  # these tests cover the functions which decide what a contour means, and
  # keeping them importable without GDAL is what lets this job run on Windows
  # at all. The parts which need GDAL are covered by the golden surface below.
  # Unused imports, unused locals, undefined names. Linux only and no
  # submodule: it reads the source and runs nothing, so a second platform would
  # answer the same question twice.
  lint:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  # Linux only. On Windows the core suite runs in windows-stack, with GDAL,
  # as the packages have it; that the pure logic imports with no GDAL is
  # asked of Linux alone now
  tests:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      # with the submodule: test_params holds the library version this code
      # speaks to against the version isofill's header defines
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pytest hypothesis
      - run: python -m pytest tests -q --ignore=tests/golden
        env:
          PYTHONPATH: .

  # The editor's widgets, offscreen. Separate from tests because PySide6 is
  # a large install the pure job has no use for. Windows, on pip's PySide6,
  # only when run by hand: windows-stack runs this suite on the stack the
  # packages are made of. In the two weeks to 2026-10-15 this leg caught two
  # things that windows-stack did not - a path's backslashes, which MSYS2's
  # Python hid until windows-stack ran outside the MSYS2 shell, and the
  # start card wider than a narrow map, for a reason not found - so it runs
  # on a release's tag - alone there - and by hand
  ui:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.ref_type == 'tag' && fromJSON('["windows-latest"]') || github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # what Qt's offscreen platform plugin still links against on a bare runner
      - name: qt runtime libraries (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      # Pinned, unlike the package's own range in pyproject.toml: a mapper's
      # machine takes what it has, but a run of this job that cannot be
      # repeated is not evidence of anything. Bumping it is deliberate, and
      # the version that was current when the UI suite last went green
      - run: pip install numpy pytest hypothesis pytest-qt "PySide6==6.11.2"
      - run: python -m pytest tests/ui tests/test_mercator.py tests/test_ui_config.py -q
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
          # for pytest-qt, in the environment rather than pyproject, so the
          # pure tests job - which has no pytest-qt - is not warned about an
          # option it cannot know
          QT_API: pyside6

  # J2a: the stack the Windows packages are made of, before anything is
  # packed. Python, PySide6, GDAL's bindings and numpy from MSYS2's UCRT64,
  # and isofill built by the same gcc against the same GDAL, so the process
  # holds one GDAL. Then the suites run on it - the golden tests among them,
  # which is the surface on Windows held to the server's - except
  # test_golden_surface, which drives the server's bash pipeline and has no
  # part in the desktop.
  windows-stack:
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      MSYS2_STACK: >-
        make
        mingw-w64-ucrt-x86_64-gcc
        mingw-w64-ucrt-x86_64-libgfortran
        mingw-w64-ucrt-x86_64-gdal
        mingw-w64-ucrt-x86_64-python
        mingw-w64-ucrt-x86_64-python-gdal
        mingw-w64-ucrt-x86_64-python-numpy
        mingw-w64-ucrt-x86_64-python-pip
        mingw-w64-ucrt-x86_64-pyside6
        mingw-w64-ucrt-x86_64-python-pytest
        mingw-w64-ucrt-x86_64-python-hypothesis
        mingw-w64-ucrt-x86_64-python-typing_extensions
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: ${{ env.MSYS2_STACK }}
      # by name: pacman under --noconfirm can answer its own "skip this
      # package?" with yes and still exit 0, as it did with gdal on
      # 2026-09-21, when two packages provided fc-libs - which is why
      # libgfortran is named, though GDAL depends on it anyway
      - name: the stack, and its versions
        run: |
          set -eu
          pacman -Q $MSYS2_STACK
          python -c "import sys, numpy, PySide6; from osgeo import gdal; print(sys.version, 'numpy', numpy.__version__, 'PySide6', PySide6.__version__, 'GDAL', gdal.__version__)"
      # built, and run: a binary that compiles and cannot find its GDAL DLLs
      # at load is the Windows failure a build step never sees. isofill-runs
      # wants its exit 2 after usage and the exact usage line
      - name: build isofill
        working-directory: extern/isofill
        run: make
      - name: run isofill
        run: bash packaging/ci/isofill-runs.sh
      # pytest and hypothesis are MSYS2's: hypothesis from PyPI now builds a
      # Rust part, which has no wheel for this platform. pytest-qt is pure
      # Python and MSYS2 has none, so it comes from PyPI, alone, into a venv
      # that sees the stack - typing_extensions, its one dependency, MSYS2's
      - name: test tools
        run: |
          set -eu
          python -m venv --system-site-packages ../venv
          ../venv/bin/python -m pip install -q --no-deps pytest-qt
      # The suites as the installed Danu runs: started by Windows, not from
      # the MSYS2 shell, with the tree's bin, isofill and Windows' own on
      # PATH, and none of MSYS2's variables - setup-msys2 puts MSYSTEM in
      # every later step's environment, and under it MSYS2's Python takes /
      # for its path separator where the installed Danu takes \. J5c's test
      # of a path's backslashes passed here and failed on pip's Python for
      # it. The separator is held to \ before anything runs
      - name: core and golden
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem Env: | Where-Object Name -Match '^(MSYS|MINGW)' | ForEach-Object { "unset $($_.Name)=$($_.Value)"; Remove-Item "Env:$($_.Name)" }
          $env:PATH = "$PWD\extern\isofill;${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONPATH = '.'
          $env:DANU_ISOFILL_LIB = "$PWD\extern\isofill\libisofill.dll"
          $py = Resolve-Path ..\venv\bin\python.exe
          $sep = & $py -c "import os; print(os.sep)"
          if ($sep -ne '\') { throw "os.sep is '$sep', not the installed Danu's '\'" }
          & $py -m danu.ui.about
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $py -m pytest tests -q --ignore=tests/ui --ignore=tests/golden/test_golden_surface.py
          exit $LASTEXITCODE
      - name: ui
        shell: pwsh
        run: |
          Get-ChildItem Env: | Where-Object Name -Match '^(MSYS|MINGW)' | ForEach-Object { "unset $($_.Name)=$($_.Value)"; Remove-Item "Env:$($_.Name)" }
          $env:PATH = "$PWD\extern\isofill;${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONPATH = '.'
          $env:DANU_ISOFILL_LIB = "$PWD\extern\isofill\libisofill.dll"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_API = 'pyside6'
          & (Resolve-Path ..\venv\bin\python.exe) -m pytest tests/ui -q
          exit $LASTEXITCODE

  # K1 (#194): the stack a macOS Danu will be made of, Apple Silicon, before
  # anything is packed - as windows-stack is Windows'. conda-forge's Python,
  # PySide6, GDAL and numpy at stack.txt's versions, the AppImage's and the
  # Windows tree's; isofill built against that GDAL by the system's clang,
  # which has no OpenMP of its own, so conda-forge's llvm-openmp provides it.
  # Then the suites, as windows-stack runs them.
  macos-stack:
    if: github.ref_type != 'tag'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: micromamba
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/micromamba" \
            https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-osx-arm64
          chmod +x "$RUNNER_TEMP/micromamba"
      - name: the stack, and its versions
        run: |
          set -eu
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba"
          spec=$(grep -v '^#' packaging/stack.txt)
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/micromamba" create -q -y -p "$RUNNER_TEMP/env" -c conda-forge --override-channels \
            $spec llvm-openmp make pytest pytest-qt hypothesis
          "$RUNNER_TEMP/env/bin/python" -c "import sys, platform, numpy, PySide6; from osgeo import gdal; print(sys.version, platform.machine(), 'numpy', numpy.__version__, 'PySide6', PySide6.__version__, 'GDAL', gdal.__version__)"
      # Apple's clang takes OpenMP through the preprocessor and libomp from
      # the environment; the rpath finds GDAL and libomp where they are. No
      # fused multiply-add, which arm64 has and the surface must not use, is
      # isofill's Makefile's own: built fused, the golden square was 4,829
      # cells out by up to 29 m
      - name: build isofill
        run: |
          set -eu
          E="$RUNNER_TEMP/env"
          PATH="$E/bin:$PATH" make -C extern/isofill isofill libisofill.so CC=cc \
            OPENMP="-Xpreprocessor -fopenmp -I$E/include -L$E/lib -lomp" \
            LDFLAGS="-Wl,-rpath,$E/lib"
          otool -L extern/isofill/isofill | grep -E 'gdal|omp'
      - name: run isofill
        run: bash packaging/ci/isofill-runs.sh
      - name: core and golden
        run: |
          set -eu
          E="$RUNNER_TEMP/env"
          export PATH="$PWD/extern/isofill:$E/bin:$PATH" PYTHONPATH=.
          export DANU_ISOFILL_LIB="$PWD/extern/isofill/libisofill.so"
          python -m danu.ui.about
          python -m pytest tests -q -p no:cacheprovider --ignore=tests/ui \
            --ignore=tests/golden/test_golden_surface.py
      - name: ui
        run: |
          set -eu
          E="$RUNNER_TEMP/env"
          export PATH="$PWD/extern/isofill:$E/bin:$PATH" PYTHONPATH=.
          export DANU_ISOFILL_LIB="$PWD/extern/isofill/libisofill.so"
          QT_QPA_PLATFORM=offscreen QT_API=pyside6 python -m pytest tests/ui -q -p no:cacheprovider

  # The check which stops the editor and the build drifting apart. It needs
  # GDAL and a reference surface, so it is Linux only and skips cleanly until
  # the fixture exists.
  golden:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      # the same set danu-server declares, plus what building isofill needs.
      # Both halves of GDAL are wanted and neither provides the other:
      # python3-gdal for the surface, which is the library, and gdal-bin for
      # the stages after the DEM, which are still gdalwarp, gdaldem and
      # gdal_contour in the shell
      - run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal python3-numpy python3-pyosmium \
                                  osmium-tool xz-utils zip python3-pytest libgdal-dev
      # binary and library both; ldconfig so the library is found by name.
      # Then run, as windows-stack runs its own: Linux's half of what the
      # isofill job did, which was this build twice
      - name: build and install isofill
        working-directory: extern/isofill
        run: make && sudo make install && sudo ldconfig
      - name: run isofill
        run: bash packaging/ci/isofill-runs.sh
      # and the one ui test that needs PROJ: the canvas projection against gdalwarp's
      - run: python3 -m pytest tests/golden tests/test_mercator_proj.py tests/test_land_clamp.py -q
        env:
          PYTHONPATH: .

  # Everything, on what danu-editor and danu-server run on: Debian 13's own
  # Python, GDAL and PySide6, which are older than the versions the jobs above
  # pin - PySide6 6.8.2 and GDAL 3.10.3 on 2026-10-14. What this found when it
  # was added: a check that asked for OGR's in-memory driver by its 3.11 name,
  # and tests that 6.8's QAction.menu() leaves holding a deleted menu.
  debian:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git git-lfs ca-certificates
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - run: |
          apt-get install -y --no-install-recommends build-essential libgdal-dev \
            gdal-bin python3-gdal python3-numpy python3-pyosmium osmium-tool xz-utils zip \
            python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets \
            python3-pyside6.qtnetwork python3-pyside6.qttest \
            python3-pytest python3-pytestqt python3-hypothesis fonts-dejavu-core
      - name: build isofill
        run: make -C extern/isofill isofill libisofill.so
      # one run, core and UI in one process: two UI tests failed so until
      # test_no_gdal stopped re-importing danu.surface in the suite's own
      # process, which left a stray copy bound on the package
      - run: |
          export PATH="$PWD/extern/isofill:$PATH"
          python3 -m pytest tests -q -p no:cacheprovider
        env:
          PYTHONPATH: .
          DANU_ISOFILL_LIB: ${{ github.workspace }}/extern/isofill/libisofill.so
          QT_QPA_PLATFORM: offscreen
          QT_API: pyside6
