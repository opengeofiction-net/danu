name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The pure logic, on both targets. GDAL is deliberately not installed here:
  # these tests cover the functions which decide what a contour means, and
  # keeping them importable without GDAL is what lets this job run on Windows
  # at all. The parts which need GDAL are covered by the golden surface below.
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # with the submodule: test_params holds the library version this code
      # speaks to against the version isofill's header defines
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pytest hypothesis
      - run: python -m pytest tests -q --ignore=tests/golden
        env:
          PYTHONPATH: .

  # The editor's widgets, offscreen, on both targets. Separate from tests
  # because PySide6 is a large install the pure job has no use for, and
  # because this is the job that answers whether Qt paints on the Windows
  # runner at all - a question worth its own red or green.
  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # what Qt's offscreen platform plugin still links against on a bare runner
      - name: qt runtime libraries (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      # Pinned, unlike the package's own range in pyproject.toml: a mapper's
      # machine takes what it has, but a run of this job that cannot be
      # repeated is not evidence of anything. Bumping it is deliberate, and
      # the version that was current when the UI suite last went green
      - run: pip install numpy pytest hypothesis pytest-qt "PySide6==6.11.2"
      - run: python -m pytest tests/ui tests/test_mercator.py tests/test_ui_config.py -q
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
          # for pytest-qt, in the environment rather than pyproject, so the
          # pure tests job - which has no pytest-qt - is not warned about an
          # option it cannot know
          QT_API: pyside6

  # isofill is C and is built rather than mocked, because a preview which does
  # not match the build is worse than no preview. Windows is here from the
  # start: finding out in phase 7 that it cannot be built is the usual way this
  # goes wrong.
  isofill:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # named once: the install and the check after it cannot then drift
    env:
      MSYS2_PACKAGES: >-
        make
        mingw-w64-ucrt-x86_64-gcc
        mingw-w64-ucrt-x86_64-libgfortran
        mingw-w64-ucrt-x86_64-gdal
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: install gdal (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev
      # MSYS2 rather than conda. The conda route was tried first and never
      # built once: conda's libgdal ships no gdal-config on Windows, and the
      # Makefile stops without one - which continue-on-error then reported as
      # success for the whole of phase 0. MSYS2's UCRT64 environment has gcc,
      # make, and a GDAL whose gdal-config works, so the same Makefile builds
      # here as on Linux with nothing special-cased in it.
      # libgfortran is named although GDAL depends on it anyway: it provides
      # fc-libs, and on 2026-09-21 the other provider - gcc-libgfortran -
      # pinned a gcc-libs the repository had already moved past. pacman under
      # --noconfirm takes the first provider, could not resolve it, answered
      # its own "skip gdal for this upgrade?" with yes, installed the
      # toolchain alone and exited 0; the build then stopped on gdal-config
      # two steps later, which read as our fault. MSYS2 has since dropped
      # gcc-libgfortran, so naming the survivor is a no-op today and takes
      # the coin toss out of the next rename
      - name: install toolchain and gdal (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: ${{ env.MSYS2_PACKAGES }}
      # pacman can answer its own "skip this package?" with yes under
      # --noconfirm and still exit 0, so the packages are asked for by name
      # here rather than trusted: pacman -Q fails on one that is not there and
      # names it. Probing the binaries would not do - gcc and make would
      # answer for themselves while gdal was missing, and libgfortran has no
      # binary of its own to ask. gdal-config goes in the log besides, because
      # a Windows build that fails later is usually a GDAL nobody expected
      - name: check the packages asked for are installed (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eu
          pacman -Q $MSYS2_PACKAGES
          gdal-config --version
          gdal-config --libs
      - name: build (linux)
        if: runner.os == 'Linux'
        working-directory: extern/isofill
        run: make
      - name: build (windows)
        if: runner.os == 'Windows'
        working-directory: extern/isofill
        shell: msys2 {0}
        run: make
      # Not just built: run. A binary that compiles and cannot find its GDAL
      # DLLs at load is the Windows failure that a build step never sees. One
      # script for both platforms, so what they assert cannot drift; it wants
      # isofill's exit 2 after usage and the exact usage line, not a substring
      - name: run (linux)
        if: runner.os == 'Linux'
        run: bash packaging/ci/isofill-runs.sh
      - name: run (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash packaging/ci/isofill-runs.sh

  # The check which stops the editor and the build drifting apart. It needs
  # GDAL and a reference surface, so it is Linux only and skips cleanly until
  # the fixture exists.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      # the same set danu-server declares, plus what building isofill needs.
      # gdal-bin is the one that matters: the pipeline is shell calling
      # ogr2ogr, gdal_rasterize, gdalwarp and gdaldem, and python3-gdal
      # provides none of them
      - run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal python3-numpy python3-pyosmium \
                                  osmium-tool xz-utils zip python3-pytest libgdal-dev
      # binary and library both; ldconfig so the library is found by name
      - name: build and install isofill
        working-directory: extern/isofill
        run: make && sudo make install && sudo ldconfig
      # and the one ui test that needs PROJ: the canvas projection against gdalwarp's
      - run: python3 -m pytest tests/golden tests/test_mercator_proj.py tests/test_land_clamp.py -q
        env:
          PYTHONPATH: .
